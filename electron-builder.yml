appId: org.iccworship.app
productName: ICCWorship
copyright: Copyright © ICCWorship contributors — MIT License
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!out/renderer/.vite/**'
  - '!out/THIRD_PARTY_NOTICES.md'
extraResources:
  - from: resources
    to: resources
    filter:
      - bibles/**
      - icon.png
      - icon.ico
# next to ICCWorship.exe, LICENSE.electron.txt and LICENSES.chromium.html (extraResources would put it in resources\)
extraFiles:
  - from: out/THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
asar: true
# Hardening of the shipped Electron binary. scripts/packaged-check.mjs verifies these and that the app still starts.
# Nothing in the app uses ELECTRON_RUN_AS_NODE / process.fork, NODE_OPTIONS or --inspect. The CDP port used by the
# e2e and packaged checks (--remote-debugging-port) is Chromium's, not Node's, so it is not affected.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}-${target}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ICCWorship
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
