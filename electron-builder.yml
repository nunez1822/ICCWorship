appId: org.iccworship.app
productName: ICCWorship
copyright: Copyright © ICCWorship contributors — MIT License
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!out/renderer/.vite/**'
  - '!out/THIRD_PARTY_NOTICES.md'
extraResources:
  - from: resources
    to: resources
    filter:
      - bibles/**
      - icon.png
      - icon.ico
  - from: out/THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
asar: true
# Electron fuses: switch off ways to run the packaged app as something else (a plain Node.js, an inspector
# target) and make it refuse a tampered app.asar. scripts/packaged-check.mjs (CI + release) verifies the
# packaged app still starts with these.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
  # Stays on for now: the app's pages are loaded from file:// (loadFile) and need it to load their scripts.
  # Serving the pages from a custom app:// protocol instead would let this be turned off too.
  grantFileProtocolExtraPrivileges: true
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}-${target}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ICCWorship
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
