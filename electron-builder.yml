appId: org.iccworship.app
productName: ICCWorship
copyright: Copyright © ICCWorship contributors — MIT License
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!out/renderer/.vite/**'
  - '!out/THIRD_PARTY_NOTICES.md'
  - '!out/sbom.cdx.json' # the SBOM goes beside the release, not inside the app
extraResources:
  - from: resources
    to: resources
    filter:
      - bibles/**
      - icon.png
      - icon.ico
# next to ICCWorship.exe, LICENSE.electron.txt and LICENSES.chromium.html (extraResources would put it in resources\)
extraFiles:
  - from: out/THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
asar: true
# Self-update (src/main/updates.ts): the installed app reads resources/app-update.yml (written from this) and looks
# for latest.yml on this repository's newest published GitHub release. The release workflow uploads latest.yml and
# the installer's .blockmap next to the exes; electron-builder itself never publishes (--publish never).
publish:
  provider: github
  owner: nunez1822
  repo: ICCWorship
  releaseType: release
# Electron fuses: switch off ways to run the packaged app as something else (a plain Node.js, an inspector
# target) and make it refuse a tampered app.asar. scripts/packaged-check.mjs (CI + release) verifies them and that
# the packaged app still starts. Nothing in the app uses ELECTRON_RUN_AS_NODE / process.fork, NODE_OPTIONS or
# --inspect. The CDP port used by the e2e and packaged checks (--remote-debugging-port) is Chromium's, not Node's.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
  # Off: the pages load from app://iccworship (src/main/appUrl.ts), never from file://, so no page gets file://'s
  # extra privileges.
  grantFileProtocolExtraPrivileges: false
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}-${target}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ICCWorship
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
