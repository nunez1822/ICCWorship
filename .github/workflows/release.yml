name: Release

# Triggered by pushing a version tag (see CONTRIBUTING.md → Releasing). Builds the Windows installers on GitHub's
# servers, checks the packaged app starts, and creates a DRAFT release with checksums and build provenance.
# A maintainer downloads and tries the draft's files, then publishes it (releases are immutable once published).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      version: ${{ steps.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Vite+ (vp): Node from .nvmrc and pnpm. Dependencies are installed after the tag check below.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          run-install: false

      - name: Check the tag matches package.json and is on main
        id: guard
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"; exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main"; exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - run: vp install
      - run: vp check
      - run: vp run test
      # No --publish: the draft release is created by the publish job below, never by electron-builder.
      - run: vp run build:win
      - name: Check the packaged app starts
        run: node scripts/packaged-check.mjs dist/win-unpacked/ICCWorship.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers
          path: |
            dist/ICCWorship-Setup-${{ steps.guard.outputs.version }}.exe
            dist/ICCWorship-Portable-${{ steps.guard.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
      id-token: write # sign the build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers
          path: release
      - name: Checksums
        working-directory: release
        run: sha256sum "ICCWorship-Setup-${{ needs.build.outputs.version }}.exe" "ICCWorship-Portable-${{ needs.build.outputs.version }}.exe" > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.exe
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::CHANGELOG.md has no section for ${VERSION}"; exit 1; fi
          cat >> notes.md <<'NOTES'

          ---
          **Verify your download:** compare the file's SHA-256 with `SHA256SUMS.txt`, or run
          `gh attestation verify <file> --repo nunez1822/ICCWorship` to confirm it was built by this repository's release workflow.
          NOTES
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/*.exe release/SHA256SUMS.txt --draft --verify-tag --title "ICCWorship ${{ needs.build.outputs.version }}" --notes-file notes.md
