name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # PR runs share a group per branch, so a new push cancels the superseded run. Each push to main gets its own
  # group (by commit sha): a queued main run is never cancelled, since its status is the record of what main is.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The branch ruleset requires this check by its job id ("ci"): keep the id, no `name:`, no matrix.
  ci:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Vite+ (vp): Node from .node-version, pnpm from package.json#packageManager, then `vp install` (frozen lockfile)
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # format (Oxfmt) + lint (Oxlint, type-aware) + type check, in one pass
      - run: vp check
      - run: vp run test
      - run: vp run build

  # Builds the installed-style app (asar, fuses), checks its fuses and that it starts. Not required: it is slower, and it guards
  # packaging changes rather than everyday code.
  packaged:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Vite+ (vp): Node from .node-version, pnpm from package.json#packageManager, then `vp install` (frozen lockfile)
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: vp run build:dir
      - run: node scripts/packaged-check.mjs
      # A build to try without installing anything (testers, reviewers): this run → Artifacts → unzip → ICCWorship.exe.
      # Unsigned and only kept a week; releases are built by release.yml, never from these.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ICCWorship-test-build-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || github.sha }}
          path: dist/win-unpacked/
          if-no-files-found: error
          retention-days: 7

  # End-to-end smoke test of the built app. Not a required check yet: it uses fixed waits and
  # must prove stable on the hosted runner first.
  smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Vite+ (vp): Node from .node-version, pnpm from package.json#packageManager, then `vp install` (frozen lockfile)
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: vp run build
      - run: vp run smoke
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-shots
          path: smoke-shots/
          retention-days: 7
          if-no-files-found: ignore
