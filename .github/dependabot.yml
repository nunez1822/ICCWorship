version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Minor and patch updates of everything except Electron, in one weekly PR.
      npm-minor-patch:
        update-types: [minor, patch]
        exclude-patterns: [electron]
    # Electron majors arrive as their own PR: upgrade at least every second major (see SECURITY.md).

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
